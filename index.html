<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股三大核心籌碼戰情室</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --up: #ef4444;
      --down: #22c55e;
      --accent: #38bdf8;
      --btn-bg: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .title-area h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .title-area p { font-size: 14px; color: var(--muted); }
    .action-area { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .time-badge { font-size: 13px; color: var(--accent); background: rgba(56, 189, 248, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .btn-update { background-color: var(--btn-bg); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-update:hover { background-color: #0369a1; }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; overflow-x: auto; }
    .tab-btn { background: none; border: none; color: var(--muted); padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s; white-space: nowrap; }
    .tab-btn.active { background: #334155; color: var(--text); }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .sub-tabs { display: flex; gap: 8px; }
    .sub-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; font-size: 13px; border-radius: 4px; cursor: pointer; }
    .sub-btn.active { border-color: var(--accent); color: var(--accent); }
    .search-input { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: 14px; outline: none; width: 220px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #1a2234; color: var(--muted); padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border); }
    td { padding: 14px 16px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    .tag-up { color: var(--up); font-weight: 600; }
    .tag-down { color: var(--down); font-weight: 600; }
    .amt-pos { color: var(--up); font-weight: 600; }
    .amt-neg { color: var(--down); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-area">
        <h1>台股三大核心籌碼戰情室</h1>
        <p>依據 TWSE / TPEx 官方盤後數據彙整 (已濾除金融股與 ETF)</p>
      </div>
      <div class="action-area">
        <div class="time-badge">最後更新時間：尚未載入資料</div>
        <button id="updateBtn" class="btn-update" onclick="triggerManualUpdate()">
          <i class="fa-solid fa-rotate"></i> 立即手動抓取最新盤後
        </button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchMainTab('FOREIGN')">外資籌碼排行</button>
      <button class="tab-btn" onclick="switchMainTab('INST')">投信籌碼排行</button>
      <button class="tab-btn" onclick="switchMainTab('MARGIN')">融資動向排行</button>
    </div>

    <div class="controls">
      <div class="sub-tabs">
        <button class="sub-btn active" id="btn-top" onclick="switchDir('TOP')">買超 / 融資增加</button>
        <button class="sub-btn" id="btn-bot" onclick="switchDir('BOT')">賣超 / 融資減少</button>
      </div>
      <input type="text" id="searchBox" class="search-input" placeholder="搜尋股票代號或名稱..." oninput="renderTable()">
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width: 60px;">名次</th>
            <th>代號</th>
            <th>名稱</th>
            <th>收盤價</th>
            <th>漲跌幅</th>
            <th id="col-shares">買賣超 (張)</th>
            <th id="col-amt">金額 (億)</th>
            <th>狀態備註</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const db = {"FOREIGN":{"TWSE":{"TOP":[],"BOT":[]},"TPEX":{"TOP":[],"BOT":[]}},"INST":{"TWSE":{"TOP":[],"BOT":[]},"TPEX":{"TOP":[],"BOT":[]}},"MARGIN":{"TWSE":{"TOP":[],"BOT":[]},"TPEX":{"TOP":[],"BOT":[]}}};

    let currentMain = 'FOREIGN';
    let currentDir = 'TOP';

    function switchMainTab(tab) {
      currentMain = tab;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (tab === 'FOREIGN' && i === 0) || (tab === 'INST' && i === 1) || (tab === 'MARGIN' && i === 2));
      });
      document.getElementById('btn-top').innerText = (tab === 'MARGIN') ? '融資增加 TOP 20' : '買超排行 TOP 20';
      document.getElementById('btn-bot').innerText = (tab === 'MARGIN') ? '融資減少 TOP 20' : '賣超排行 TOP 20';
      document.getElementById('col-shares').innerText = (tab === 'MARGIN') ? '資增減 (張)' : '買賣超 (張)';
      document.getElementById('col-amt').innerText = (tab === 'MARGIN') ? '資增金額 (億)' : '買賣金額 (億)';
      renderTable();
    }

    function switchDir(dir) {
      currentDir = dir;
      document.getElementById('btn-top').classList.toggle('active', dir === 'TOP');
      document.getElementById('btn-bot').classList.toggle('active', dir === 'BOT');
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      const list = (db[currentMain] && db[currentMain]['TWSE'] && db[currentMain]['TWSE'][currentDir]) ? db[currentMain]['TWSE'][currentDir] : [];
      const tbody = document.getElementById('list-body');
      tbody.innerHTML = '';

      const filtered = list.filter(item => item.c.toLowerCase().includes(q) || item.n.toLowerCase().includes(q));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--muted); padding: 30px;">尚無資料或結算中，請點擊右上角手動更新觸發抓取。</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const isUp = item.chg.startsWith('+');
        const isDown = item.chg.startsWith('-');
        const badgeClass = isUp ? 'tag-up' : (isDown ? 'tag-down' : '');
        const amtClass = item.a.startsWith('+') ? 'amt-pos' : (item.a.startsWith('-') ? 'amt-neg' : '');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.r}</strong></td>
          <td><strong>${item.c}</strong></td>
          <td>${item.n}</td>
          <td>${item.p}</td>
          <td><span class="${badgeClass}">${item.chg}</span></td>
          <td>${item.s}</td>
          <td class="${amtClass}">${item.a}</td>
          <td style="color: var(--muted);">${item.note}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function triggerManualUpdate() {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt('請輸入您的 GitHub Personal Access Token (金鑰僅保存在本機瀏覽器):');
        if (!token) return;
        token = token.trim();
        localStorage.setItem('gh_token', token);
      }

      const btn = document.getElementById('updateBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 雲端觸發中...';
      btn.disabled = true;

      try {
        const res = await fetch('https://api.github.com/repos/poyuancheng0714/Stock-dash-board/actions/workflows/daily_update.yml/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (res.status === 204) {
          alert('✅ 指令發送成功！GitHub Actions 雲端爬蟲已啟動。\n預計 1~2 分鐘後抓取完成，請稍後按 F5 重新整理頁面。');
        } else if (res.status === 401 || res.status === 403) {
          alert('❌ 金鑰驗證失敗！請確認 Token 是否有效，且具備「repo」與「workflow」權限。');
          localStorage.removeItem('gh_token');
        } else {
          alert('觸發失敗，狀態代碼：' + res.status);
        }
      } catch (err) {
        alert('網路連線失敗：' + err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-rotate"></i> 立即手動抓取最新盤後';
        btn.disabled = false;
      }
    }

    renderTable();
  </script>
</body>
</html>
