      currentDir = dir;
      document.getElementById('btn-top').classList.toggle('active', dir === 'TOP');
      document.getElementById('btn-bot').classList.toggle('active', dir === 'BOT');
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      const list = (db[currentMain] && db[currentMain]['TWSE'] && db[currentMain]['TWSE'][currentDir]) ? db[currentMain]['TWSE'][currentDir] : [];
      const tbody = document.getElementById('list-body');
      tbody.innerHTML = '';

      const filtered = list.filter(item => item.c.toLowerCase().includes(q) || item.n.toLowerCase().includes(q));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--muted); padding: 30px;">尚無資料或結算中，請點擊右上角手動更新觸發抓取。</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const isUp = item.chg.startsWith('+');
        const isDown = item.chg.startsWith('-');
        const badgeClass = isUp ? 'tag-up' : (isDown ? 'tag-down' : '');
        const amtClass = item.a.startsWith('+') ? 'amt-pos' : (item.a.startsWith('-') ? 'amt-neg' : '');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.r}</strong></td>
          <td><strong>${item.c}</strong></td>
          <td>${item.n}</td>
          <td>${item.p}</td>
          <td><span class="${badgeClass}">${item.chg}</span></td>
          <td>${item.s}</td>
          <td class="${amtClass}">${item.a}</td>
          <td style="color: var(--muted);">${item.note}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function triggerManualUpdate() {
      let token = localStorage.getItem('gh_token');
      if (!token) {
        token = prompt('請輸入您的 GitHub Personal Access Token (金鑰僅保存在本機瀏覽器):');
        if (!token) return;
        token = token.trim();
        localStorage.setItem('gh_token', token);
      }

      const btn = document.getElementById('updateBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 雲端觸發中...';
      btn.disabled = true;

      try {
        const res = await fetch('https://api.github.com/repos/poyuancheng0714/Stock-dash-board/actions/workflows/daily_update.yml/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (res.status === 204) {
          alert('✅ 指令發送成功！GitHub Actions 雲端爬蟲已啟動。\n預計 1~2 分鐘後抓取完成，請稍後按 F5 重新整理頁面。');
        } else if (res.status === 401 || res.status === 403) {
          alert('❌ 金鑰驗證失敗！請確認 Token 是否有效，且具備「repo」與「workflow」權限。');
          localStorage.removeItem('gh_token');
        } else {
          alert('觸發失敗，狀態代碼：' + res.status);
        }
      } catch (err) {
        alert('網路連線失敗：' + err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-rotate"></i> 立即手動抓取最新盤後';
        btn.disabled = false;
      }
    }

    renderTable();
  </script>
</body>
</html>
