let main = 'FOREIGN';
let mkt = 'TWSE';
let dir = 'TOP';

function setMain(type) {
  main = type;
  document.getElementById('tab-foreign').classList.toggle('active', type === 'FOREIGN');
  document.getElementById('tab-inst').classList.toggle('active', type === 'INST');
  document.getElementById('tab-margin').classList.toggle('active', type === 'MARGIN');

  const sharesTitle = type === 'FOREIGN' ? '外資買賣超張數' : (type === 'INST' ? '投信買賣超張數' : '資券增減張數');
  document.getElementById('col-shares').textContent = sharesTitle;

  const topPrefix = type === 'FOREIGN' ? '外資買超' : (type === 'INST' ? '投信買超' : '融資增加');
  const botPrefix = type === 'FOREIGN' ? '外資賣超' : (type === 'INST' ? '投信賣超' : '融資減少');
  document.getElementById('btn-top').textContent = `${topPrefix} TOP 20`;
  document.getElementById('btn-bot').textContent = `${botPrefix} TOP 20`;

  render();
}

function setMarket(market) {
  mkt = market;
  document.getElementById('btn-twse').classList.toggle('active', market === 'TWSE');
  document.getElementById('btn-tpex').classList.toggle('active', market === 'TPEX');
  render();
}

function setDir(direction) {
  dir = direction;
  document.getElementById('btn-top').classList.toggle('active', direction === 'TOP');
  document.getElementById('btn-bot').classList.toggle('active', direction === 'BOT');
  render();
}

function render() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const list = db[main][mkt][dir] || [];
  const tbody = document.getElementById('list-body');
  tbody.innerHTML = '';

  const filtered = list.filter(item => item.c.includes(query) || item.n.toLowerCase().includes(query));

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 24px; color: var(--muted);">查無相符資料</td></tr>`;
    return;
  }

  filtered.forEach(item => {
    const isUp = item.chg.startsWith('+');
    const isDown = item.chg.startsWith('-');
    const badgeClass = isUp ? 'tag-up' : (isDown ? 'tag-down' : '');
    const amtClass = item.a.startsWith('+') ? 'val-red' : (item.a.startsWith('-') ? 'val-green' : '');

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${item.r}</strong></td>
      <td><strong>${item.c}</strong></td>
      <td>${item.n}</td>
      <td>${item.p}</td>
      <td><span class="${badgeClass}">${item.chg}</span></td>
      <td>${item.s}</td>
      <td class="${amtClass}">${item.a}</td>
      <td style="color: var(--muted);">${item.note}</td>
    `;
    tbody.appendChild(tr);
  });
}

// 首次載入執行
render();
